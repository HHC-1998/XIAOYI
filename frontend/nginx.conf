server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 上传大小限制：略高于后端 import 接口 50MB 上限，提前拒绝超大请求
    # （后端 /api/data/import 另有 Content-Length 头校验兜底，见 09_数据管理详解.md）
    client_max_body_size 60m;

    # 前端路由（history 模式）回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # VAD/ORT 资产（public/vad2，目录带版本号）：禁止浏览器长缓存旧文件/旧 MIME 响应
    #（曾因 .mjs 以错误 MIME 下发被缓存，no-cache 约束新响应、换 /vad2/ 才能绕开已存缓存）
    location /vad2/ {
        add_header Cache-Control "no-cache";
    }

    # .mjs = ES Module（onnxruntime-web 的 wasm 加载胶水，见 08_桌面助手详解.md §3）：nginx 默认
    # mime.types 无 mjs 映射，会以 application/octet-stream 下发，浏览器拒绝按模块加载 → Silero VAD
    # 报 "Failed to fetch dynamically imported module: ...ort-wasm-simd-threaded.mjs"。
    # 正则 location 优先级高于上面的前缀 location /，仅命中 .mjs 请求；no-cache 防浏览器
    # 缓存旧 MIME 响应（曾因错误 MIME 被缓存，修复后仍用旧响应导致同报错复发）。
    location ~* \.mjs$ {
        types { application/javascript mjs; }
        add_header Cache-Control "no-cache";
    }

    # 反向代理后端 API
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE 流式接口需要关闭缓冲
        proxy_buffering off;
        proxy_cache off;
        # WebSocket 升级（2026-09-03 流式 ASR /asr-stream，04 §8 / 台账 38 节）：
        # 缺这两行时 /api/voice/asr-stream 握手会失败（返回 200/400 而非 101）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # SSE 长连接超过默认 60s 会被断开，调大到 1 小时
        proxy_read_timeout 3600s;
    }
}
